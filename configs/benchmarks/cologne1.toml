# Benchmark cologne1 (RESCO): Cologne, single signal, 07:00-08:00, calibrated demand (TAPAS Cologne).
# The scenario's own signal programs and timing as in RESCO: 3 s yellow, a decision every 10 s.
#   uv run python networks/benchmarks/fetch.py cologne1
#   tsc evaluate configs/benchmarks/cologne1.toml
name = "bench_cologne1"
workers = 4

[network]
path = "networks/benchmarks/cologne1/cologne1.net.xml"
rebuild_tls = false      # the scenario's own programs (its fixed-time baseline)
yellow = 3
all_red = 0
min_green = 7

[demand]
generator = "file"
route_files = ["networks/benchmarks/cologne1/cologne1.rou.xml"]
begin = 25200
duration = 3600
count_undeparted = true  # as RESCO: vehicles still waiting to enter count in the delay

[signals]
decision_interval = 10

[observation]
mode = "detector"

[evaluate]
baselines = ["fixed", "maxpressure", "maxpressure_det", "advanced_mp"]
levels = [1]             # the demand is the scenario's own (no demand levels)
n_seeds = 10
