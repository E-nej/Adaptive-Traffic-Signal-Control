# Our RL (step-2 setup: detector state, queue reward, shield) on the ingolstadt7 benchmark.
# Every episode replays the scenario's demand (the same route file, new SUMO seed).
#   tsc train configs/benchmarks/rl/ingolstadt7.toml --seeds 0-2
#   tsc evaluate configs/benchmarks/ingolstadt7.toml --runs "outputs/train/rl_ingolstadt7/s*" --no-baselines --out outputs/eval/rl_ingolstadt7
name = "rl_ingolstadt7"
workers = 3

[network]
path = "networks/benchmarks/ingolstadt7/ingolstadt7.net.xml"
rebuild_tls = false      # the scenario's own programs (its fixed-time baseline)
yellow = 3
all_red = 0
min_green = 7

[demand]
generator = "file"
route_files = ["networks/benchmarks/ingolstadt7/ingolstadt7.rou.xml"]
begin = 57600
duration = 3600
count_undeparted = true  # as RESCO: vehicles still waiting to enter count in the delay

[signals]
decision_interval = 10
max_green = 60           # the step-2 safety shield
max_red = 90

[observation]            # step 2: detectors with noise / dropout, no messages
mode = "detector"
comm = false
noise = 0.05
dropout = 0.02

[reward]
kind = "queue"

[train]
episodes = 150
level_min = 1.0          # the demand is the scenario's own
level_max = 1.0
val_levels = [1.0]
