# rl2 (approach detector + SMDP) + improvement 7 on the cologne3 corridor: directional messages
# from the neighbours.  rl2: approaching
# vehicles (150 m approach detector) and SMDP discounting (gamma 0.995 per second).
# Every episode replays the scenario's demand (the same route file, new SUMO seed).
#   tsc train configs/benchmarks/rl_extras/rl2c_cologne3.toml --seeds 0-2
#   tsc evaluate configs/benchmarks/cologne3.toml --runs "outputs/train/rl2c_cologne3/s*" --no-baselines --out outputs/eval/rl2c_cologne3
name = "rl2c_cologne3"
workers = 3

[network]
path = "networks/benchmarks/cologne3/cologne3.net.xml"
rebuild_tls = false      # the scenario's own programs (its fixed-time baseline)
yellow = 3
all_red = 0
min_green = 7

[demand]
generator = "file"
route_files = ["networks/benchmarks/cologne3/cologne3.rou.xml"]
begin = 25200
duration = 3600
count_undeparted = true  # as RESCO: vehicles still waiting to enter count in the delay

[signals]
decision_interval = 10
max_green = 60           # the step-2 safety shield
max_red = 90

[observation]            # step 2 detectors + directional messages
mode = "detector"
comm = true
message = "directional"
noise = 0.05
dropout = 0.02
approach_length = 150.0  # vehicles approaching within ~ speed limit x decision interval

[reward]
kind = "queue"

[agent]
smdp = true
gamma = 0.995            # per second (~ 0.95 per 10 s decision)

[train]
episodes = 150
level_min = 1.0          # the demand is the scenario's own
level_max = 1.0
val_levels = [1.0]
