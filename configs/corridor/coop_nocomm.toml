# Corridor RL without communication but with the cooperative reward (2E.3):
# r_i + 0.5·Σ r_neighbours — separates the effect of the reward from that of messages.
#   tsc train configs/corridor/coop_nocomm.toml --seeds 0-4
name = "corridor_coop_nocomm"
workers = 5

[network]
path = "networks/corridor/corridor.net.xml"

[demand]
generator = "od"
major_share = 0.6
tidal_share = 0.7
tidal_random = true

[signals]
max_green = 60
max_red = 90

[observation]
mode = "detector"
comm = false
noise = 0.05
dropout = 0.02

[reward]
kind = "multi"
neighbour_weight = 0.5

[train]
level_min = 1000.0
level_max = 4500.0
val_levels = [2000.0, 4000.0]
