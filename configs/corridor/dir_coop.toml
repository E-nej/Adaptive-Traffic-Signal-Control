# Corridor RL with directional messages (2E.2) and a cooperative reward (2E.3):
# r_i + 0.5·Σ r_neighbours, so agents gain from their neighbours' traffic too.
#   tsc train configs/corridor/dir_coop.toml --seeds 0-4
name = "corridor_dir_coop"
workers = 5

[network]
path = "networks/corridor/corridor.net.xml"

[demand]
generator = "od"
major_share = 0.6
tidal_share = 0.7
tidal_random = true

[signals]
max_green = 60
max_red = 90

[observation]
mode = "detector"
comm = true
message = "directional"
noise = 0.05
dropout = 0.02

[reward]
kind = "multi"
neighbour_weight = 0.5

[train]
level_min = 1000.0
level_max = 4500.0
val_levels = [2000.0, 4000.0]
