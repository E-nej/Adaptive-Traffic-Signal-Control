# Step 2H on the corridor: a manager picks one expert for all 7 signals every 5 min.
#   tsc train configs/hierarchy/corridor_network.toml --seeds 0-2
name = "hier_corridor_network"
workers = 3

[network]
path = "networks/corridor/corridor.net.xml"

[demand]
generator = "od"
major_share = 0.6
tidal_share = 0.7
tidal_random = true

[signals]
control = "hierarchy"
decision_interval = 5
max_extension = 20
max_red = 150
experts = ["greenwave", "coord_actuated", "maxpressure", "actuated"]
actuated_loops = "sumo"   # the actuated expert as close to SUMO's as we got (2H)

[hierarchy]
scope = "network"
interval = 300

[observation]
mode = "detector"
noise = 0.05
dropout = 0.02

[train]
level_min = 1000.0
level_max = 5000.0
val_levels = [1500.0, 3000.0, 4500.0]
plan_match = 0.5
