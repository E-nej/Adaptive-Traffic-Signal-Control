# Step 2H: corridor, one expert for all 7 signals
# Step 2H v2: manager only (workers off), delay reward, default expert = the best single
# expert on validation; the manager leaves it only if Q is better by 5 %, and the run
# deploys it unless the learned manager beats it on validation.
#   tsc train configs/hierarchy/v2/corridor_network.toml --seeds 0-2
name = "hier2_corridor_network"
workers = 3

[network]
path = "networks/corridor/corridor.net.xml"

[demand]
generator = "od"
major_share = 0.6
tidal_share = 0.7
tidal_random = true

[signals]
control = "hierarchy"
decision_interval = 5    # workers decide every 5 s of green; the expert acts every second
max_extension = 20
hold_guard = true
max_red = 150
experts = ["greenwave", "coord_actuated", "maxpressure", "actuated"]
actuated_loops = "sumo"

[hierarchy]
scope = "network"
interval = 300
worker = "off"
reward = "delay"
default_expert = "auto"
margin = 0.05

[observation]
mode = "detector"
comm = true
message = "directional"
noise = 0.05
dropout = 0.02

[reward]                 # junction agents only: unused with workers off
kind = "multi"
neighbour_weight = 0.5

[agent]                  # junction agents only: unused with workers off
shared = true

[train]
level_min = 1000.0
level_max = 5000.0
val_levels = [1500.0, 3000.0, 4500.0]
plan_match = 0.5
