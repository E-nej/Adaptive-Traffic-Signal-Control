# Step 2H: Maribor, one expert for the whole network
# Step 2H v3c: lookup manager, experts exactly as their baselines (no max-red shield, no hold guard), keys per interval, 6 scenarios per level. Every expert runs alone at a grid of demand levels; the
# manager picks the best one for the flow and jam it measures (no DQN, no workers).
#   tsc train configs/hierarchy/v3c/maribor_network.toml --seeds 0
name = "hier3c_maribor_network"
workers = 14

[network]
path = "networks/maribor/titova.net.xml"

[demand]
generator = "od"
major_share = 0.2
tidal_share = 0.7
tidal_axis = [0.0, 1.0]
tidal_random = true
min_distance = 300.0

[signals]
control = "hierarchy"
decision_interval = 5    # workers decide every 5 s of green; the expert acts every second
max_extension = 20
experts = ["greenwave", "coord_actuated", "maxpressure", "actuated"]
actuated_loops = "sumo"

[hierarchy]
scope = "network"
interval = 300
worker = "off"
manager = "table"
table_scenarios = 6
hysteresis = 2

[observation]
mode = "detector"
comm = true
message = "directional"
noise = 0.05
dropout = 0.02

[reward]                 # junction agents only: unused with workers off
kind = "multi"
neighbour_weight = 0.5

[agent]                  # junction agents only: unused with workers off
shared = true

[train]
level_min = 2000.0
level_max = 8000.0
val_levels = [3000.0, 6000.0, 8000.0]
plan_levels = [2000.0, 4000.0, 6000.0, 7000.0, 8000.0]
plan_match = 0.5
