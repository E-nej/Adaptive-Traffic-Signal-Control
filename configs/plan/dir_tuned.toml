# Step 2F: RL adjusts the corridor's green-wave plan (FOLLOW / HOLD / EARLY) instead of
# choosing stages freely; no communication.  Other plan configs change one thing each.
#   tsc train configs/plan/nocomm.toml --seeds 0-2
name = "plan_dir_tuned"
workers = 3

[network]
path = "networks/corridor/corridor.net.xml"

[demand]
generator = "od"
major_share = 0.6
tidal_share = 0.7
tidal_random = true

[signals]
control = "plan"
decision_interval = 5
max_extension = 20

[observation]
mode = "detector"
comm = true
message = "directional"
noise = 0.05
dropout = 0.02

[reward]
kind = "multi"
scale = 0.1

[train]
level_min = 1000.0
level_max = 5000.0
val_levels = [1500.0, 3000.0, 4500.0]
plan_match = 0.5
eps_fraction = 0.4

[agent]
lr = 5e-4
tau = 0.01
