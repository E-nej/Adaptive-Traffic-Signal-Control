# Step 2F evaluation, tuned plans (each level and direction has its own plan).
#   tsc evaluate configs/plan/eval_tuned.toml --runs "outputs/train/plan_*/s*"
name = "plan_tuned"
workers = 4

[network]
path = "networks/corridor/corridor.net.xml"

[demand]
generator = "od"
major_share = 0.6
tidal_share = 0.7
tidal_random = true

[observation]
mode = "detector"
noise = 0.05
dropout = 0.02

[evaluate]
baselines = ["greenwave", "greenwave_py", "plan_actuated"]
levels = [1000, 2000, 3000, 4000, 5000]
n_seeds = 10
