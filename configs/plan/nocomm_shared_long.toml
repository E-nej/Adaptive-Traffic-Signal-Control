# Step 2F round 2: as dir_shared_long without communication (the clean comparison:
# only the messages differ).
#   tsc train configs/plan/nocomm_shared_long.toml --seeds 0-4
name = "plan_nocomm_shared_long"
workers = 5

[network]
path = "networks/corridor/corridor.net.xml"

[demand]
generator = "od"
major_share = 0.6
tidal_share = 0.7
tidal_random = true

[signals]
control = "plan"
decision_interval = 5
max_extension = 20

[observation]
mode = "detector"
comm = false
noise = 0.05
dropout = 0.02

[reward]
kind = "multi"

[train]
level_min = 1000.0
level_max = 5000.0
val_levels = [1500.0, 3000.0, 4500.0]
plan_match = 0.5
episodes = 300

[agent]
shared = true
