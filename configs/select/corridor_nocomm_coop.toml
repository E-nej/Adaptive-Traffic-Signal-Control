# Step 2G: corridor controller selection with the cooperative reward (nocomm).  With the local
# reward the selector picked max-pressure ~50 % of the time (its own queue shrinks, the
# neighbours' green wave breaks).
#   tsc train configs/select/corridor_nocomm_coop.toml --seeds 0-2
name = "select_corridor_nocomm_coop"
workers = 3

[network]
path = "networks/corridor/corridor.net.xml"

[demand]
generator = "od"
major_share = 0.6
tidal_share = 0.7
tidal_random = true

[signals]
control = "select"
select_interval = 90
decision_interval = 5
max_extension = 20
max_red = 150            # longest plan cycle (122 s) + extension: never overrides a plan

[observation]
mode = "detector"
comm = false
noise = 0.05
dropout = 0.02

[reward]
kind = "multi"
scale = 0.1
neighbour_weight = 1.0      # r_i + sum of neighbours' rewards: a junction pays for breaking their green wave

[agent]
shared = true
gamma = 0.8              # one decision per ~90 s: a shorter horizon in decisions

[train]
level_min = 1000.0
level_max = 5000.0
val_levels = [1500.0, 3000.0, 4500.0]
plan_match = 0.5
