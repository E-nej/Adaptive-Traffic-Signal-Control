# Step 2G on Maribor: controller selection with the cooperative reward.
#   tsc train configs/select/maribor_comm_coop.toml --seeds 0-2
name = "select_maribor_comm_coop"
workers = 3

[network]
path = "networks/maribor/titova.net.xml"

[demand]
generator = "od"
major_share = 0.2
tidal_share = 0.7
tidal_axis = [0.0, 1.0]
tidal_random = true
min_distance = 300.0

[signals]
control = "select"
select_interval = 90
decision_interval = 5
max_extension = 20
max_red = 150
experts = ["greenwave", "coord_actuated", "maxpressure", "actuated"]   # + isolated actuated (best at high demand)

[observation]
mode = "detector"
comm = true
noise = 0.05
dropout = 0.02

[reward]
kind = "multi"
scale = 0.1
neighbour_weight = 1.0      # r_i + sum of neighbours' rewards

[agent]
shared = true
gamma = 0.8

[train]
level_min = 2000.0
level_max = 8000.0
val_levels = [3000.0, 6000.0, 8000.0]
plan_levels = [2000.0, 4000.0, 6000.0, 7000.0, 8000.0]
plan_match = 0.5
