# Step 2: VA with detector observations and a detector-computable reward,
# sensor noise / dropout and the max-green / max-red safety shield.
#   tsc train configs/step2/det_queue.toml --seeds 0-4
name = "step2_det_queue"
workers = 5

[signals]
max_green = 60
max_red = 90

[observation]
mode = "detector"
comm = true
noise = 0.05
dropout = 0.02

[reward]
kind = "det_queue"
