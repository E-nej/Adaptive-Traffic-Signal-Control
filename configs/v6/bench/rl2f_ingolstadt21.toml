# Generated by configs/v6/make_configs.py (step 2I); edit that script, not this file.
# Benchmark ingolstadt21: phase-wise FRAP-style network shared by all junctions without detector noise / dropout.
#   tsc train configs/v6/bench/rl2f_ingolstadt21.toml --seeds 0-4
name = "rl2f_ingolstadt21"
workers = 1

[network]
path = "networks/benchmarks/ingolstadt21/ingolstadt21.net.xml"
rebuild_tls = false
yellow = 3
all_red = 0
min_green = 7

[demand]
generator = "file"
route_files = [
    "networks/benchmarks/ingolstadt21/ingolstadt21.rou.xml",
]
begin = 57600
duration = 3600
count_undeparted = true

[signals]
decision_interval = 10
max_green = 60
max_red = 90
red_call = true

[observation]
mode = "detector"
comm = false
noise = 0.0
dropout = 0.0
approach_length = 150.0
layout = "phase"

[reward]
kind = "queue"

[agent]
smdp = true
gamma = 0.995
phase_net = true
hidden = [
    64,
    64,
]
buffer_size = 100000

[train]
episodes = 150
level_min = 1.0
level_max = 1.0
val_levels = [
    1.0,
]
