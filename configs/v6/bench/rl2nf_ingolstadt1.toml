# Generated by configs/v6/make_configs.py (step 2I); edit that script, not this file.
# Benchmark ingolstadt1: rl2 without detector noise / dropout.
#   tsc train configs/v6/bench/rl2nf_ingolstadt1.toml --seeds 0-4
name = "rl2nf_ingolstadt1"
workers = 1

[network]
path = "networks/benchmarks/ingolstadt1/ingolstadt1.net.xml"
rebuild_tls = false
yellow = 3
all_red = 0
min_green = 7

[demand]
generator = "file"
route_files = [
    "networks/benchmarks/ingolstadt1/ingolstadt1.rou.xml",
]
begin = 57600
duration = 3600
