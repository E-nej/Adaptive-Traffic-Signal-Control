comm = false
noise = 0.0
dropout = 0.0
approach_length = 150.0

[reward]
kind = "queue"

[agent]
smdp = true
gamma = 0.995

[train]
episodes = 150
level_min = 1.0
level_max = 1.0
val_levels = [
    1.0,
]
