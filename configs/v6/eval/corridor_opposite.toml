# Generated by configs/v6/make_configs.py (step 2I); edit that script, not this file.
# Step 2I: v6 tables and RL experts on corridor vs the noise-free baselines (opposite-direction plans).
#   tsc evaluate configs/v6/eval/corridor_opposite.toml
name = "v6_corridor_opposite"
workers = 14

[network]
path = "networks/corridor/corridor.net.xml"

[demand]
generator = "od"
major_share = 0.6
tidal_share = 0.7
tidal_random = true

[signals]
actuated_loops = "sumo"

[observation]
mode = "detector"
noise = 0.0
dropout = 0.0

[evaluate]
baselines = [
    "actuated",
    "maxpressure_det",
    "greenwave_py",
    "plan_actuated",
]
runs = [
    "outputs/train/v6_corridor_table*/s*",
    "outputs/train/v6_corridor_rl*/s*",
]
levels = [
    1000,
    2000,
    3000,
    4000,
    5000,
]
n_seeds = 10
plan_direction = "opposite"
