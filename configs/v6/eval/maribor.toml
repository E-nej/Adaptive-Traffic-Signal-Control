# Generated by configs/v6/make_configs.py (step 2I); edit that script, not this file.
# Step 2I: v6 tables and RL experts on maribor vs the noise-free baselines.
#   tsc evaluate configs/v6/eval/maribor.toml
name = "v6_maribor"
workers = 14

[network]
path = "networks/maribor/titova.net.xml"

[demand]
generator = "od"
major_share = 0.2
tidal_share = 0.7
tidal_axis = [
    0.0,
    1.0,
]
tidal_random = true
min_distance = 300.0

[signals]
actuated_loops = "sumo"

[observation]
mode = "detector"
noise = 0.0
dropout = 0.0

[evaluate]
baselines = [
    "actuated",
    "maxpressure_det",
    "greenwave_py",
    "actuated_py",
]
runs = [
    "outputs/train/v6_maribor_table*/s*",
    "outputs/train/v6_maribor_rl*/s*",
]
levels = [
    2000,
    4000,
    6000,
    7000,
    8000,
]
n_seeds = 10
