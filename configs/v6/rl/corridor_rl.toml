# Generated by configs/v6/make_configs.py (step 2I); edit that script, not this file.
# Stage-control RL on corridor, one DQN per junction (as the benchmarks' rl2): detector state + approach detector,
# SMDP, queue reward, noise-free, no shield. Also the hierarchy's rl expert.
#   tsc train configs/v6/rl/corridor_rl.toml --seeds 0-2
name = "v6_corridor_rl"
workers = 1

[network]
path = "networks/corridor/corridor.net.xml"

[demand]
generator = "od"
major_share = 0.6
tidal_share = 0.7
tidal_random = true

[signals]
control = "stages"
decision_interval = 5

[observation]
mode = "detector"
comm = false
approach_length = 150.0
noise = 0.0
dropout = 0.0

[reward]
kind = "queue"

[agent]
smdp = true
gamma = 0.995

[train]
level_min = 1000.0
level_max = 5000.0
val_levels = [
    1500.0,
    3000.0,
    4500.0,
]
episodes = 150
val_every = 15
val_per_level = 2
