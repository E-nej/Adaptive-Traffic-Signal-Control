# Generated by configs/v6/make_configs.py (step 2I); edit that script, not this file.
# Stage-control RL on maribor, one DQN per junction (as the benchmarks' rl2): detector state + approach detector,
# SMDP, queue reward, noise-free, no shield. Also the hierarchy's rl expert.
#   tsc train configs/v6/rl/maribor_rl.toml --seeds 0-2
name = "v6_maribor_rl"
workers = 1

[network]
path = "networks/maribor/titova.net.xml"

[demand]
generator = "od"
major_share = 0.2
tidal_share = 0.7
tidal_axis = [
    0.0,
    1.0,
]
tidal_random = true
min_distance = 300.0

[signals]
control = "stages"
decision_interval = 5

[observation]
mode = "detector"
comm = false
approach_length = 150.0
noise = 0.0
dropout = 0.0

[reward]
kind = "queue"

[agent]
smdp = true
gamma = 0.995

[train]
level_min = 2000.0
level_max = 8000.0
val_levels = [
    3000.0,
    6000.0,
    8000.0,
]
episodes = 150
val_every = 15
val_per_level = 2
