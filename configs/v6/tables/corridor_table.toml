# Generated by configs/v6/make_configs.py (step 2I); edit that script, not this file.
# Lookup-table hierarchy on corridor: experts ['greenwave', 'coord_actuated', 'maxpressure', 'actuated', 'rl', 'rlf'], the classic ones with
# their v6 worker where one passed acceptance; per level the table picks the
# expert and whether its worker acts. Nothing is trained.
#   tsc train configs/v6/tables/corridor_table.toml --seeds 0-2
name = "v6_corridor_table"
workers = 4

[network]
path = "networks/corridor/corridor.net.xml"

[demand]
generator = "od"
major_share = 0.6
tidal_share = 0.7
tidal_random = true

[signals]
control = "hierarchy"
decision_interval = 5
max_extension = 20
experts = [
    "greenwave",
    "coord_actuated",
    "maxpressure",
    "actuated",
    "rl",
    "rlf",
]
actuated_loops = "sumo"

[signals.rl_experts]
rl = "outputs/train/v6_corridor_rl/s{seed}"
rlf = "outputs/train/v6_corridor_rlf/s{seed}"

[hierarchy]
scope = "network"
interval = 300
worker = "expert"
manager = "table"
table_scenarios = 8
hysteresis = 2
table_alone = true

[hierarchy.worker_runs]
greenwave = "outputs/train/v6_wk_corridor_greenwave/s{seed}"
coord_actuated = "outputs/train/v6_wk_corridor_coord_actuated/s{seed}"
maxpressure = "outputs/train/v6_wk_corridor_maxpressure/s{seed}"

[observation]
mode = "detector"
comm = true
message = "directional"
noise = 0.0
dropout = 0.0
approach_length = 150.0

[reward]
kind = "delay"
neighbour_weight = 0.5

[agent]
shared = true
smdp = true
gamma = 0.995
ref_action = 0

[train]
level_min = 1000.0
level_max = 5000.0
val_levels = [
    1500.0,
    3000.0,
    4500.0,
]
plan_match = 0.5
episodes = 300
