# Generated by configs/v6/make_configs.py (step 2I); edit that script, not this file.
# Worker for the coord_actuated expert on corridor: starts as the expert (AGREE), SMDP,
# approach detector, noise-free.
#   tsc train configs/v6/workers/corridor_coord_actuated.toml --seeds 0-2
name = "v6_wk_corridor_coord_actuated"
workers = 1

[network]
path = "networks/corridor/corridor.net.xml"

[demand]
generator = "od"
major_share = 0.6
tidal_share = 0.7
tidal_random = true

[signals]
control = "hierarchy"
decision_interval = 5
max_extension = 20
experts = [
    "greenwave",
    "coord_actuated",
    "maxpressure",
    "actuated",
    "rl",
    "rlf",
]
actuated_loops = "sumo"

[hierarchy]
scope = "network"
manager = "fixed"
fixed_expert = 1
worker = "residual"
accept_scenarios = 4

[observation]
mode = "detector"
comm = true
message = "directional"
noise = 0.0
dropout = 0.0
approach_length = 150.0

[reward]
kind = "delay"
neighbour_weight = 0.5
scale = 0.1

[agent]
shared = true
smdp = true
gamma = 0.995
ref_action = 0

[train]
level_min = 1000.0
level_max = 5000.0
val_levels = [
    1500.0,
    3000.0,
    4500.0,
]
plan_match = 0.5
episodes = 150
eps_start = 0.2
eps_min = 0.02
eps_fraction = 0.5
val_every = 25
val_per_level = 2
