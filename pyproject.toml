[project]
name = "tsc"
version = "0.3.0"
description = "Adaptive traffic-signal control with multi-agent deep RL in SUMO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # SUMO is pinned exactly: netconvert / randomTrips output (and so every
    # result) depends on the SUMO version.
    "eclipse-sumo==1.28.0",
    "libsumo==1.28.0",
    "traci==1.28.0",
    "sumolib==1.28.0",
    # Which build (CPU, CUDA or ROCm) is chosen by the dependency groups below.
    "torch>=2.14,<2.15",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "tomli-w>=1.0",
]

[project.scripts]
tsc = "tsc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# PyTorch build, one of these (docs/GPU.md).  `uv sync` installs the CPU build (the
# bit-exact reference).  GPUs:  uv sync --no-group cpu --group cuda   (NVIDIA RTX 20xx and
# newer, incl. RTX 50xx), --group cuda126 (older NVIDIA, e.g. Pascal / Quadro P2000) or
# --group rocm (AMD, Linux); then run with UV_NO_SYNC=1 so `uv run` keeps that build.
cpu = ["torch>=2.14,<2.15"]
cuda = ["torch>=2.14,<2.15"]
cuda126 = ["torch>=2.14,<2.15"]
rocm = ["torch>=2.14,<2.15 ; sys_platform == 'linux'", "triton-rocm ; sys_platform == 'linux'"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }, { group = "cuda126" }, { group = "rocm" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cuda" },
    { index = "pytorch-cu126", group = "cuda126" },
    { index = "pytorch-rocm", group = "rocm" },
]
triton-rocm = [{ index = "pytorch-rocm", group = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sumo: runs short SUMO simulations (deselect with -m 'not sumo')"]
