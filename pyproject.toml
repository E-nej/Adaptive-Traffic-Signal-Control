[project]
name = "tsc"
version = "0.2.0"
description = "Adaptive traffic-signal control with multi-agent deep RL in SUMO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # SUMO is pinned exactly: netconvert / randomTrips output (and so every
    # result) depends on the SUMO version.
    "eclipse-sumo==1.28.0",
    "libsumo==1.28.0",
    "traci==1.28.0",
    "sumolib==1.28.0",
    "tensorflow>=2.21,<2.22",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# NVIDIA GPUs (opt-in, see docs/GPU.md): CUDA / cuDNN runtime libraries for TensorFlow's
# CUDA build.  AMD GPUs use the tensorflow-rocm wheel instead (manual install, docs/GPU.md).
cuda = ["tensorflow[and-cuda]>=2.21,<2.22"]

[project.scripts]
tsc = "tsc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sumo: runs short SUMO simulations (deselect with -m 'not sumo')"]
filterwarnings = [
    # Keras passes copy=False to np.array on TensorFlow tensors (harmless, NumPy 2 notice)
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]
